server:
  port: 8083

spring:
  application:
    name: geo-time-mcp-server
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://host.docker.internal:5433/microservice_metrics
    username: metrics_writer
    password: writer_pass
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  ai:
    model:
      chat: openai
      embedding: ollama
    openai:
      base-url: http://localhost:18080
      api-key: CDOT_AI_SECRET_SECURE_TOKEN_2026_XYZ
      chat:
        options:
          model: ollama/qwen2.5:7b
          temperature: 0.1
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      embedding:
        options:
          model: ${EMBEDDING_MODEL:embeddinggemma-2:270m}
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST:localhost}
          port: ${MILVUS_PORT:19530}
        database-name: default
        collection-name: city_aliases
        embedding-dimension: 768
        index-type: IVF_FLAT
        metric-type: COSINE		
        initialize-schema: true
    mcp:
      server:
        name: geo-time-tools
        version: 1.0.0
        type: SYNC

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${JAEGER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  observations:
    annotations:
      enabled: true
